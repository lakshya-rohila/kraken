name: Fuzz

# Coverage-guided fuzzing of every parser that reads program output
# (OSC/APC/DCS scanner, Kitty graphics, sixel). Weekly, and on demand.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "600"

jobs:
  fuzz:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target: [rewriter, sixel, kitty]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || '600' }} -rss_limit_mb=2048 -timeout=5
      - name: keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
