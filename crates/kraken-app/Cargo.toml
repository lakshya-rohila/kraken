[package]
name = "kraken-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kraken"
path = "src/main.rs"

[dependencies]
kraken-config.workspace = true
kraken-term.workspace = true
kraken-render.workspace = true
kraken-mux.workspace = true
kraken-ui.workspace = true
alacritty_terminal.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
arboard.workspace = true
log.workspace = true
env_logger.workspace = true
libc = "0.2"
serde = { workspace = true }
serde_json = "1"
muda = "0.21.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
accesskit = "0.25.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
